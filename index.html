<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行別針收藏地圖</title>
  
  <!-- 強制放行地圖圖片與 Supabase 請求，防止 Cloudflare CSP 阻擋 -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    :root {
      --ink: #101214;
      --panel: rgba(20, 22, 24, 0.94);
      --panel-soft: #24272a;
      --line: rgba(255, 255, 255, 0.14);
      --text: #f6f4ef;
      --muted: #aaa9a4;
      --accent: #ff4438;
      --accent-dark: #d92f28;
    }
    html, body {
      height: 100% !important;
      width: 100% !important;
      margin: 0;
      padding: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--ink);
    }
    body { display: flex; overflow: hidden; }

    #sidebar {
      width: 320px;
      min-width: 320px;
      padding: 28px 24px;
      color: var(--text);
      background: var(--panel);
      border-right: 1px solid var(--line);
      box-shadow: 18px 0 50px rgba(0,0,0,0.28);
      z-index: 1000;
      display: flex; 
      flex-direction: column; 
      gap: 18px;
      overflow-y: auto;
      box-sizing: border-box;
    }
    h2 { margin: 0; color: var(--text); font-size: 1.25rem; letter-spacing: .02em; }
    .eyebrow { color: var(--accent); font-size: .68rem; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .sidebar-copy { margin: -8px 0 2px; color: var(--muted); font-size: .82rem; line-height: 1.55; }
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.75rem; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    input[type="text"], input[type="file"] {
      padding: 12px 13px; border: 1px solid var(--line); border-radius: 4px; width: 100%; box-sizing: border-box;
      color: var(--text); background: var(--panel-soft); outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,68,56,.15); }
    input[type="file"] { color: var(--muted); font-size: .78rem; }
    input[type="file"]::file-selector-button { margin-right: 10px; padding: 7px 10px; border: 0; border-radius: 3px; color: #fff; background: #45494d; cursor: pointer; }
    button {
      padding: 12px; background: var(--accent); color: white; border: none;
      border-radius: 4px; cursor: pointer; font-weight: 800; letter-spacing: .03em; width: 100%;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .58; cursor: wait; }

    #map { 
      flex: 1; 
      height: 100vh !important; 
      width: 100% !important; 
      background-color: #242628;
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #1d1f21; color: var(--text); }
    .leaflet-popup-content-wrapper { border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 14px 36px rgba(0,0,0,.42); }
    .leaflet-popup-close-button { color: #fff !important; }
    .popup-card { text-align: left; width: 210px; }
    .popup-card h4 { margin: 2px 0 9px; color: var(--text); font-size: 1rem; }
    .popup-card img { width: 100%; max-height: 210px; object-fit: cover; border-radius: 3px; box-shadow: 0 5px 18px rgba(0,0,0,.35); }
    .popup-coords { margin: 8px 0 0; color: var(--muted); font-size: .7rem; letter-spacing: .04em; }
    .delete-btn { margin-top: 10px; background: #3a3d40; padding: 7px 9px; font-size: 0.72rem; }
    .pin-marker { width: 22px; height: 22px; box-sizing: border-box; border: 4px solid rgba(255,255,255,.92); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgba(255,68,56,.25), 0 4px 14px rgba(0,0,0,.55); }
    
    .status-badge {
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 4px;
      margin-top: 5px;
    }
    .status-cloud { background: rgba(54,179,126,.11); color: #83e0b2; border: 1px solid rgba(83,214,151,.25); }
    .status-local { background: rgba(255,190,77,.10); color: #ffd27d; border: 1px solid rgba(255,190,77,.24); }
    .photo-status { display: none; padding: 10px; border-left: 3px solid var(--accent); color: var(--muted); background: rgba(255,255,255,.04); font-size: .76rem; line-height: 1.45; }
    .photo-status.show { display: block; }
    .photo-preview { display: none; width: 100%; max-height: 180px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
    .photo-preview.show { display: block; }

    /* 手機版選單開關按鈕（預設隱藏，只在小螢幕顯示） */
    #menuToggleBtn {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 1100;
      width: 44px;
      height: 44px;
      padding: 0;
      background: rgba(20,22,24,.92);
      color: #fff;
      border: none;
      border-radius: 50%;
      box-shadow: 0 5px 18px rgba(0,0,0,0.4);
      font-size: 1.3rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    /* 遮罩層，點擊可收合選單 */
    #sidebarOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 999;
    }

    @media (max-width: 768px) {
      #menuToggleBtn {
        display: flex;
      }

      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        transform: translateX(-100%);
        transition: transform 0.25s ease-in-out;
        width: min(86vw, 340px);
        min-width: 0;
        padding-top: 76px;
        box-shadow: 16px 0 40px rgba(0,0,0,0.45);
      }

      #sidebar.open {
        transform: translateX(0);
      }

      #sidebar.open ~ #sidebarOverlay {
        display: block;
      }

      #map {
        width: 100% !important;
      }

      .leaflet-control-zoom { margin-right: 14px !important; margin-bottom: calc(14px + env(safe-area-inset-bottom)) !important; }
    }
  </style>
</head>
<body>

  <button id="menuToggleBtn" aria-label="開啟選單">☰</button>

  <div id="sidebar">
    <div class="eyebrow">Pin collector / Japan</div>
    <h2>旅行別針收藏地圖</h2>
    <p class="sidebar-copy">一枚徽章，一次抵達。</p>
    
    <div class="form-group">
      <label for="addressInput">景點名稱或地址（選填）：</label>
      <input type="text" id="addressInput" placeholder="留白時會使用照片定位" />
    </div>

    <div class="form-group">
      <label for="photoInput">上傳別針照片：</label>
      <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" />
      <img id="photoPreview" class="photo-preview" alt="照片預覽" />
      <div id="photoStatus" class="photo-status" aria-live="polite"></div>
    </div>

    <button id="addPinBtn">儲存別針</button>

    <div id="statusNotice" class="status-badge status-local">檢查雲端連線中...</div>
  </div>

  <div id="sidebarOverlay"></div>

  <div id="map"></div>

  <!-- Leaflet 地圖套件＋照片 EXIF 讀取套件 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/exifr@7.1.3/dist/lite.umd.js"></script>

  <script>
    // ----------------------------------------------------
    // ⚠️ 請填入你的 Supabase 憑證資訊：
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://wdjmrwhpzjkoafioangf.supabase.co'; // 替換為你的 Project URL
    const SUPABASE_KEY = 'sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp';              // 替換為你的 anon public key
    // ----------------------------------------------------

    const isCloudConfigured = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('xxxxxx');

    // 1. 初始化 Leaflet 地圖（深色地形風格，放大縮小移到右下，避免手機選單遮擋）
    const map = L.map('map', {
      center: [36.2048, 138.2529],
      zoom: 6,
      zoomControl: false
    });
    const allPinsBounds = L.latLngBounds([]);
    let loadedPinCount = 0;

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    window.addEventListener('load', () => {
      setTimeout(() => { map.invalidateSize(); }, 300);
    });

    // 手機版選單開合邏輯
    const sidebarEl = document.getElementById('sidebar');
    const menuToggleBtn = document.getElementById('menuToggleBtn');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    function openSidebar() {
      sidebarEl.classList.add('open');
      menuToggleBtn.innerText = '✕';
    }
    function closeSidebar() {
      sidebarEl.classList.remove('open');
      menuToggleBtn.innerText = '☰';
      setTimeout(() => { map.invalidateSize(); }, 260);
    }

    menuToggleBtn.addEventListener('click', () => {
      sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
    });
    sidebarOverlay.addEventListener('click', closeSidebar);

    // 選取照片後，先在手機／瀏覽器端縮圖並轉成 WebP，再交給上傳流程。
    const photoInput = document.getElementById('photoInput');
    const photoPreview = document.getElementById('photoPreview');
    const photoStatus = document.getElementById('photoStatus');
    let processedPhotoFile = null;
    let photoProcessingPromise = Promise.resolve(null);
    let photoGpsPromise = Promise.resolve(null);
    let photoProcessingError = null;
    let previewObjectUrl = '';

    photoInput.addEventListener('change', () => {
      const sourceFile = photoInput.files[0];
      processedPhotoFile = null;
      photoProcessingError = null;

      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      photoPreview.classList.remove('show');
      photoStatus.classList.remove('show');

      if (!sourceFile) {
        photoProcessingPromise = Promise.resolve(null);
        photoGpsPromise = Promise.resolve(null);
        return;
      }

      photoStatus.textContent = '正在讀取照片定位並最佳化 WebP…';
      photoStatus.classList.add('show');
      photoGpsPromise = readPhotoGps(sourceFile).catch(error => {
        console.warn('照片沒有可讀取的 GPS 資訊:', error);
        return null;
      });

      photoProcessingPromise = convertToWebP(sourceFile)
        .then(file => {
          processedPhotoFile = file;
          previewObjectUrl = URL.createObjectURL(file);
          photoPreview.src = previewObjectUrl;
          photoPreview.classList.add('show');
          return file;
        })
        .catch(error => {
          photoProcessingError = error;
          console.error('WebP 轉換失敗:', error);
          photoStatus.textContent = '無法處理這張照片，請改選 JPG、PNG 或 WebP。';
          return null;
        });

      Promise.all([photoProcessingPromise, photoGpsPromise]).then(([file, gps]) => {
        if (!file) return;
        const sizeResult = file.size <= sourceFile.size
          ? `${formatBytes(sourceFile.size)} → ${formatBytes(file.size)}`
          : `${formatBytes(file.size)}（原檔已非常精簡）`;
        const gpsResult = gps
          ? `✓ 已取得照片定位｜${gps.latitude.toFixed(5)}, ${gps.longitude.toFixed(5)}`
          : '照片沒有 GPS；請填寫景點名稱或地址';
        photoStatus.innerHTML = `✓ WebP 已最佳化｜${sizeResult}<br>${gpsResult}`;
      });
    });

    // 更新狀態 UI
    const noticeDiv = document.getElementById('statusNotice');
    if (isCloudConfigured) {
      noticeDiv.className = "status-badge status-cloud";
      noticeDiv.innerHTML = "☁️ 模式：<b>Supabase 雲端同步中</b>";
    } else {
      noticeDiv.className = "status-badge status-local";
      noticeDiv.innerHTML = "⚠️ 提示：未填寫 Supabase 憑證，目前切換為本機模式。";
    }

    // 2. 載入 Pins
    loadPins();

    async function loadPins() {
      if (!isCloudConfigured) {
        let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
        pins.forEach(pin => renderMarker(pin));
        fitMapToAllPins();
        return;
      }

      try {
        // 直接呼叫 Supabase REST API (防止 SDK 載入報錯卡死)
        const res = await fetch(`${SUPABASE_URL}/rest/v1/pins?select=*`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        
        if (Array.isArray(data)) {
          data.forEach(pin => renderMarker({
            id: pin.id,
            address: pin.address,
            lat: pin.lat,
            lng: pin.lng,
            photo: pin.photo_url
          }));
          fitMapToAllPins();
        }
      } catch (err) {
        console.error("雲端讀取失敗:", err);
      }
    }

    // 3. 新增 Pin
    document.getElementById('addPinBtn').addEventListener('click', async () => {
      const address = document.getElementById('addressInput').value.trim();
      const sourcePhotoFile = photoInput.files[0];

      if (!address && !sourcePhotoFile) {
        alert("請輸入景點名稱或地址，或選擇一張含有 GPS 定位的照片。");
        return;
      }

      const btn = document.getElementById('addPinBtn');
      btn.innerText = "處理中...";
      btn.disabled = true;

      try {
        const photoFile = sourcePhotoFile ? await photoProcessingPromise : null;
        const photoGps = sourcePhotoFile ? await photoGpsPromise : null;

        if (sourcePhotoFile && !photoFile) {
          throw photoProcessingError || new Error('照片處理失敗');
        }

        let lat;
        let lon;
        let pinLabel = address || '未命名別針';

        // A. 有填名稱／地址時優先搜尋；留白時改用照片 EXIF GPS。
        if (address) {
          btn.innerText = "搜尋景點位置中...";
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
          const geoData = await geoRes.json();

          if (!geoData || geoData.length === 0) {
            alert("找不到這個景點名稱或地址，請換個關鍵字再試一次。");
            return;
          }

          lat = parseFloat(geoData[0].lat);
          lon = parseFloat(geoData[0].lon);
        } else if (isValidGps(photoGps)) {
          lat = photoGps.latitude;
          lon = photoGps.longitude;
        } else {
          alert("這張照片沒有 GPS 定位資訊，請填寫景點名稱或地址。");
          return;
        }

        let photoPublicUrl = "";

        // B. 處理雲端模式
        if (isCloudConfigured) {
          // B1. 上傳相片到 Supabase Storage
          if (photoFile) {
            btn.innerText = "照片上傳雲端中...";
            const fileName = `${Date.now()}_${Math.random().toString(36).slice(2, 8)}.webp`;
            
            const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/pin-photos/${fileName}`, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'image/webp'
              },
              body: photoFile
            });

            if (!uploadRes.ok) {
              let detail = '';
              try {
                const errJson = await uploadRes.json();
                detail = errJson.message || errJson.error || JSON.stringify(errJson);
              } catch (e) {
                detail = await uploadRes.text().catch(() => '');
              }
              throw new Error(`照片上傳失敗 (狀態碼: ${uploadRes.status})：${detail}`);
            }

            photoPublicUrl = `${SUPABASE_URL}/storage/v1/object/public/pin-photos/${fileName}`;
          }

          // B2. 寫入 Supabase 表格
          btn.innerText = "儲存座標資料中...";
          const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/pins`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify({ address: pinLabel, lat: lat, lng: lon, photo_url: photoPublicUrl })
          });

          const insertedData = await insertRes.json();
          if (insertRes.ok && insertedData.length > 0) {
            const newPin = insertedData[0];
            renderMarker({ id: newPin.id, address: newPin.address, lat: newPin.lat, lng: newPin.lng, photo: newPin.photo_url });
            map.flyTo([lat, lon], 12);
          } else {
            const detail = insertedData.message || insertedData.error || JSON.stringify(insertedData);
            throw new Error(`資料庫寫入失敗 (狀態碼: ${insertRes.status})：${detail}`);
          }

        } else {
          // 本機保護模式
          if (photoFile) photoPublicUrl = await convertBase64(photoFile);
          const newPin = { id: Date.now(), address: pinLabel, lat, lng: lon, photo: photoPublicUrl };
          let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
          pins.push(newPin);
          localStorage.setItem('japan_pins', JSON.stringify(pins));
          renderMarker(newPin);
          map.flyTo([lat, lon], 12);
        }

        document.getElementById('addressInput').value = '';
        photoInput.value = '';
        processedPhotoFile = null;
        photoProcessingPromise = Promise.resolve(null);
        photoGpsPromise = Promise.resolve(null);
        photoProcessingError = null;
        if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = '';
        photoPreview.removeAttribute('src');
        photoPreview.classList.remove('show');
        photoStatus.classList.remove('show');

        // 手機版：新增成功後自動收合選單，方便看到剛新增的地圖標記
        if (window.innerWidth <= 768) closeSidebar();

      } catch (err) {
        console.error(err);
        alert(`錯誤: ${err.message || '連線失敗'}`);
      } finally {
        btn.innerText = "儲存別針";
        btn.disabled = false;
      }
    });

    // 渲染 Pin
    function renderMarker(pin) {
      const pinLat = Number(pin.lat);
      const pinLng = Number(pin.lng);
      if (!Number.isFinite(pinLat) || !Number.isFinite(pinLng)) return;

      allPinsBounds.extend([pinLat, pinLng]);
      loadedPinCount += 1;

      const pinIcon = L.divIcon({
        className: '',
        html: '<div class="pin-marker" aria-hidden="true"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        popupAnchor: [0, -15]
      });
      const marker = L.marker([pinLat, pinLng], { icon: pinIcon, title: pin.address }).addTo(map);
      const popupDiv = document.createElement('div');
      popupDiv.className = 'popup-card';
      
      let photoHTML = pin.photo 
        ? `<img src="${pin.photo}" alt="${pin.address}">` 
        : `<p style="color:#888; font-size:0.8rem;">（未上傳照片）</p>`;

      popupDiv.innerHTML = `
        <h4>${pin.address}</h4>
        ${photoHTML}
        <p class="popup-coords">${Number(pin.lat).toFixed(5)}, ${Number(pin.lng).toFixed(5)}</p>
        <button class="delete-btn">刪除此別針</button>
      `;

      popupDiv.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm("確定要刪除嗎？")) {
          if (isCloudConfigured) {
            try {
              // 先刪除資料庫紀錄
              const delRes = await fetch(`${SUPABASE_URL}/rest/v1/pins?id=eq.${pin.id}`, {
                method: 'DELETE',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
              });
              if (!delRes.ok) {
                const detail = await delRes.text().catch(() => '');
                alert(`刪除失敗 (狀態碼: ${delRes.status})：${detail || '請確認 pins 資料表已設定 DELETE 權限 (RLS policy)'}`);
                return; // 刪除失敗時不移除地圖上的標記，避免畫面與資料庫不一致
              }

              // 資料庫刪除成功後，再刪除 Storage 裡對應的照片檔案（避免孤兒檔案佔用空間）
              if (pin.photo) {
                const fileName = pin.photo.split('/pin-photos/')[1];
                if (fileName) {
                  await fetch(`${SUPABASE_URL}/storage/v1/object/pin-photos/${fileName}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                  }).catch(err => console.error('照片檔案刪除失敗（不影響 pin 刪除結果）:', err));
                }
              }
            } catch (err) {
              alert(`刪除失敗：${err.message || '連線錯誤'}`);
              return;
            }
          } else {
            let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
            pins = pins.filter(p => p.id !== pin.id);
            localStorage.setItem('japan_pins', JSON.stringify(pins));
          }
          map.removeLayer(marker);
        }
      });

      marker.bindPopup(popupDiv);
    }

    // 首次載入完成後，自動顯示所有已收藏的 Pin。
    // 例如目前同時涵蓋台灣與日本；未來加入歐洲後，會自動擴大至歐洲—日本。
    function fitMapToAllPins() {
      if (!allPinsBounds.isValid() || loadedPinCount === 0) return;

      setTimeout(() => {
        map.invalidateSize();

        if (loadedPinCount === 1) {
          map.setView(allPinsBounds.getCenter(), 8, { animate: false });
          return;
        }

        map.fitBounds(allPinsBounds, {
          padding: [42, 42],
          maxZoom: 9,
          animate: false
        });
      }, 80);
    }

    async function readPhotoGps(file) {
      if (!window.exifr || typeof window.exifr.gps !== 'function') return null;
      const gps = await window.exifr.gps(file);
      return isValidGps(gps) ? gps : null;
    }

    function isValidGps(gps) {
      return Boolean(
        gps &&
        Number.isFinite(gps.latitude) &&
        Number.isFinite(gps.longitude) &&
        gps.latitude >= -90 && gps.latitude <= 90 &&
        gps.longitude >= -180 && gps.longitude <= 180
      );
    }

    async function convertToWebP(file) {
      // 已經是 WebP 時保留原檔，避免重新編碼反而變大。
      if (file.type === 'image/webp') return file;

      let imageSource;
      let sourceWidth;
      let sourceHeight;

      if ('createImageBitmap' in window) {
        imageSource = await createImageBitmap(file);
        sourceWidth = imageSource.width;
        sourceHeight = imageSource.height;
      } else {
        imageSource = await loadImage(file);
        sourceWidth = imageSource.naturalWidth;
        sourceHeight = imageSource.naturalHeight;
      }

      // 先以兼顧清晰度的設定輸出；若比原檔大，就逐步降低品質／尺寸。
      const attempts = [
        [1600, 0.78],
        [1600, 0.68],
        [1280, 0.72],
        [1280, 0.62],
        [1080, 0.60],
        [960, 0.55],
        [800, 0.50],
        [640, 0.46]
      ];
      let smallestBlob = null;

      for (const [maxDimension, quality] of attempts) {
        const scale = Math.min(1, maxDimension / Math.max(sourceWidth, sourceHeight));
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(sourceWidth * scale));
        canvas.height = Math.max(1, Math.round(sourceHeight * scale));

        const context = canvas.getContext('2d', { alpha: false });
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(imageSource, 0, 0, canvas.width, canvas.height);

        const candidate = await canvasToWebP(canvas, quality);
        if (!smallestBlob || candidate.size < smallestBlob.size) smallestBlob = candidate;

        // 至少節省約 5%，才停止嘗試後續壓縮設定。
        if (candidate.size <= file.size * 0.95) {
          smallestBlob = candidate;
          break;
        }
      }

      if (imageSource.close) imageSource.close();
      if (!smallestBlob) throw new Error('瀏覽器無法輸出 WebP');

      const baseName = file.name.replace(/\.[^.]+$/, '') || 'pin-photo';
      return new File([smallestBlob], `${baseName}.webp`, { type: 'image/webp', lastModified: Date.now() });
    }

    function canvasToWebP(canvas, quality) {
      return new Promise((resolve, reject) => {
        canvas.toBlob(
          result => result ? resolve(result) : reject(new Error('瀏覽器無法輸出 WebP')),
          'image/webp',
          quality
        );
      });
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
        image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('照片讀取失敗')); };
        image.src = url;
      });
    }

    function formatBytes(bytes) {
      if (!Number.isFinite(bytes) || bytes <= 0) return '0 KB';
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
