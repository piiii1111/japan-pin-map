<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本景點別針收藏地圖</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { display: flex; overflow: hidden; }

    #sidebar {
      width: 320px;
      min-width: 320px;
      padding: 20px;
      background-color: #f8f9fa;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      overflow-y: auto;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; color: #2c3e50; font-size: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.9rem; font-weight: bold; color: #495057; }
    input[type="text"], input[type="file"] {
      padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; width: 100%; box-sizing: border-box;
    }
    button {
      padding: 10px; background-color: #d9534f; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;
    }
    button:hover { background-color: #c9302c; }

    #map { flex: 1; height: 100%; width: 100%; background-color: #aad3df; }
    .popup-card { text-align: center; max-width: 200px; }
    .popup-card h4 { margin: 5px 0 8px 0; color: #333; }
    .popup-card img { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .delete-btn { margin-top: 8px; background-color: #6c757d; padding: 4px 8px; font-size: 0.75rem; color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    .status-badge {
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 5px;
    }
    .status-cloud { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-local { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📍 日本別針收藏地圖</h2>
    
    <div class="form-group">
      <label for="addressInput">景點名稱或地址：</label>
      <input type="text" id="addressInput" placeholder="例如：東京鐵塔 或 清水寺..." />
    </div>

    <div class="form-group">
      <label for="photoInput">上傳別針照片：</label>
      <input type="file" id="photoInput" accept="image/*" />
    </div>

    <button id="addPinBtn">搜尋並新增至地圖</button>

    <div id="statusNotice" class="status-badge status-local">💻 目前模式：本機儲存</div>
  </div>

  <div id="map"></div>

  <!-- 載入 Leaflet 與 Supabase SDK -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ----------------------------------------------------
    // ⚠️ 如果要連線 Supabase，請把下面兩行替換成你的專案憑證：
    // ----------------------------------------------------
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    // ----------------------------------------------------

    let supabase = null;
    let isCloudMode = false;

    // 1. 初始化 Leaflet 地圖
    const map = L.map('map', {
      center: [36.2048, 138.2529],
      zoom: 6
    });

    // 使用極高相容性的 CARTO Voyager 底圖（防止被封鎖）
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // 強制重新計算地圖容器大小，確保陸地載入
    setTimeout(() => { map.invalidateSize(); }, 300);

    // 2. 檢查 Supabase 狀態
    function checkSystemStatus() {
      const noticeDiv = document.getElementById('statusNotice');
      
      if (typeof window.supabase !== 'undefined' && SUPABASE_URL.startsWith('https://') && SUPABASE_KEY !== 'YOUR_SUPABASE_ANON_KEY') {
        try {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          isCloudMode = true;
          noticeDiv.className = "status-badge status-cloud";
          noticeDiv.innerHTML = "☁️ 模式：<b>雲端同步 (Supabase)</b>";
        } catch (e) {
          console.warn("Supabase 連線失敗:", e);
        }
      }

      if (!isCloudMode) {
        noticeDiv.className = "status-badge status-local";
        noticeDiv.innerHTML = "💻 模式：<b>本機暫存 (LocalStorage)</b><br><small>尚未設定 Supabase 憑證</small>";
      }
    }

    checkSystemStatus();
    loadPins();

    // 3. 載入地圖標記
    async function loadPins() {
      if (isCloudMode) {
        try {
          const { data, error } = await supabase.from('pins').select('*');
          if (!error && data) {
            data.forEach(pin => renderMarker({
              id: pin.id,
              address: pin.address,
              lat: pin.lat,
              lng: pin.lng,
              photo: pin.photo_url
            }));
            return;
          }
        } catch (e) { console.error("讀取失敗:", e); }
      }

      // 本機讀取模式
      let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
      pins.forEach(pin => renderMarker(pin));
    }

    // 4. 新增 Pin
    document.getElementById('addPinBtn').addEventListener('click', async () => {
      const address = document.getElementById('addressInput').value.trim();
      const photoFile = document.getElementById('photoInput').files[0];

      if (!address) {
        alert("請輸入景點名稱或地址！");
        return;
      }

      const btn = document.getElementById('addPinBtn');
      btn.innerText = "搜尋座標中...";
      btn.disabled = true;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          alert("找不到該地址！");
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);
        let photoUrl = "";

        if (isCloudMode) {
          if (photoFile) {
            btn.innerText = "上傳照片至雲端...";
            const fileName = `${Date.now()}_${photoFile.name}`;
            const { error: uploadError } = await supabase.storage.from('pin-photos').upload(fileName, photoFile);
            if (uploadError) throw uploadError;

            const { data: urlData } = supabase.storage.from('pin-photos').getPublicUrl(fileName);
            photoUrl = urlData.publicUrl;
          }

          btn.innerText = "寫入資料庫...";
          const { data: insertData, error: insertError } = await supabase
            .from('pins')
            .insert([{ address, lat, lng: lon, photo_url: photoUrl }])
            .select();

          if (insertError) throw insertError;

          renderMarker({
            id: insertData[0].id,
            address: insertData[0].address,
            lat: insertData[0].lat,
            lng: insertData[0].lng,
            photo: insertData[0].photo_url
          });

        } else {
          if (photoFile) {
            photoUrl = await convertBase64(photoFile);
          }

          const newPin = { id: Date.now(), address, lat, lng: lon, photo: photoUrl };
          let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
          pins.push(newPin);
          localStorage.setItem('japan_pins', JSON.stringify(pins));
          renderMarker(newPin);
        }

        map.flyTo([lat, lon], 12);
        document.getElementById('addressInput').value = '';
        document.getElementById('photoInput').value = '';

      } catch (err) {
        console.error("錯誤:", err);
        alert("新增失敗，請檢查網路連線。");
      } finally {
        btn.innerText = "搜尋並新增至地圖";
        btn.disabled = false;
      }
    });

    function renderMarker(pin) {
      const marker = L.marker([pin.lat, pin.lng]).addTo(map);
      const popupDiv = document.createElement('div');
      popupDiv.className = 'popup-card';
      
      let photoHTML = pin.photo 
        ? `<img src="${pin.photo}" alt="${pin.address}">` 
        : `<p style="color:#888; font-size:0.8rem;">（未上傳照片）</p>`;

      popupDiv.innerHTML = `
        <h4>${pin.address}</h4>
        ${photoHTML}
        <br>
        <button class="delete-btn">刪除此別針</button>
      `;

      popupDiv.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm("確定要刪除嗎？")) {
          if (isCloudMode) {
            await supabase.from('pins').delete().eq('id', pin.id);
          } else {
            let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
            pins = pins.filter(p => p.id !== pin.id);
            localStorage.setItem('japan_pins', JSON.stringify(pins));
          }
          map.removeLayer(marker);
        }
      });

      marker.bindPopup(popupDiv);
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
