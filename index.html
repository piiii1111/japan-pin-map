<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本景點別針收藏地圖</title>
  
  <!-- 強制放行地圖圖片與 Supabase 請求，防止 Cloudflare CSP 阻擋 -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:;">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body {
      height: 100% !important;
      width: 100% !important;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body { display: flex; overflow: hidden; }

    #sidebar {
      width: 320px;
      min-width: 320px;
      padding: 20px;
      background-color: #f8f9fa;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
      overflow-y: auto;
      box-sizing: border-box;
    }
    h2 { margin-top: 0; color: #2c3e50; font-size: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.9rem; font-weight: bold; color: #495057; }
    input[type="text"], input[type="file"] {
      padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; width: 100%; box-sizing: border-box;
    }
    button {
      padding: 10px; background-color: #d9534f; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;
    }
    button:hover { background-color: #c9302c; }

    #map { 
      flex: 1; 
      height: 100vh !important; 
      width: 100% !important; 
      background-color: #f0f0f0; 
    }

    .popup-card { text-align: center; max-width: 200px; }
    .popup-card h4 { margin: 5px 0 8px 0; color: #333; }
    .popup-card img { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .delete-btn { margin-top: 8px; background-color: #6c757d; padding: 4px 8px; font-size: 0.75rem; color: white; border: none; border-radius: 4px; cursor: pointer; }
    
    .status-badge {
      font-size: 0.8rem;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 5px;
    }
    .status-cloud { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-local { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📍 日本別針收藏地圖</h2>
    
    <div class="form-group">
      <label for="addressInput">景點名稱或地址：</label>
      <input type="text" id="addressInput" placeholder="例如：東京鐵塔 或 清水寺..." />
    </div>

    <div class="form-group">
      <label for="photoInput">上傳別針照片：</label>
      <input type="file" id="photoInput" accept="image/*" />
    </div>

    <button id="addPinBtn">搜尋並上傳至雲端</button>

    <div id="statusNotice" class="status-badge status-local">檢查雲端連線中...</div>
  </div>

  <div id="map"></div>

  <!-- 僅引入 Leaflet 地圖套件 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ----------------------------------------------------
    // ⚠️ 請填入你的 Supabase 憑證資訊：
    // ----------------------------------------------------
    const https://wdjmrwhpzjkoafioangf.supabase.co = 'https://wdjmrwhpzjkoafioangf.supabase.co'; // 替換為你的 Project URL
    const sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp = 'eyJhbGciOi...';              // 替換為你的 anon public key
    // ----------------------------------------------------

    const isCloudConfigured = https://wdjmrwhpzjkoafioangf.supabase.co.startsWith('https://') && !https://wdjmrwhpzjkoafioangf.supabase.co.includes('xxxxxx');

    // 1. 初始化 Leaflet 地圖 (Esri 底圖，安定性最高)
    const map = L.map('map', {
      center: [36.2048, 138.2529],
      zoom: 6
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 18
    }).addTo(map);

    window.addEventListener('load', () => {
      setTimeout(() => { map.invalidateSize(); }, 300);
    });

    // 更新狀態 UI
    const noticeDiv = document.getElementById('statusNotice');
    if (isCloudConfigured) {
      noticeDiv.className = "status-badge status-cloud";
      noticeDiv.innerHTML = "☁️ 模式：<b>Supabase 雲端同步中</b>";
    } else {
      noticeDiv.className = "status-badge status-local";
      noticeDiv.innerHTML = "⚠️ 提示：未填寫 Supabase 憑證，目前切換為本機模式。";
    }

    // 2. 載入 Pins
    loadPins();

    async function loadPins() {
      if (!isCloudConfigured) {
        let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
        pins.forEach(pin => renderMarker(pin));
        return;
      }

      try {
        // 直接呼叫 Supabase REST API (防止 SDK 載入報錯卡死)
        const res = await fetch(`${https://wdjmrwhpzjkoafioangf.supabase.co}/rest/v1/pins?select=*`, {
          headers: { 'apikey': sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp, 'Authorization': `Bearer ${sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp}` }
        });
        const data = await res.json();
        
        if (Array.isArray(data)) {
          data.forEach(pin => renderMarker({
            id: pin.id,
            address: pin.address,
            lat: pin.lat,
            lng: pin.lng,
            photo: pin.photo_url
          }));
        }
      } catch (err) {
        console.error("雲端讀取失敗:", err);
      }
    }

    // 3. 新增 Pin
    document.getElementById('addPinBtn').addEventListener('click', async () => {
      const address = document.getElementById('addressInput').value.trim();
      const photoFile = document.getElementById('photoInput').files[0];

      if (!address) {
        alert("請輸入景點名稱或地址！");
        return;
      }

      const btn = document.getElementById('addPinBtn');
      btn.innerText = "處理中...";
      btn.disabled = true;

      try {
        // A. 地址轉座標 (Geocoding)
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const geoData = await geoRes.json();

        if (!geoData || geoData.length === 0) {
          alert("找不到該地址！");
          return;
        }

        const lat = parseFloat(geoData[0].lat);
        const lon = parseFloat(geoData[0].lon);
        let photoPublicUrl = "";

        // B. 處理雲端模式
        if (isCloudConfigured) {
          // B1. 上傳相片到 Supabase Storage
          if (photoFile) {
            btn.innerText = "照片上傳雲端中...";
            const fileName = `${Date.now()}_${photoFile.name}`;
            
            const uploadRes = await fetch(`${https://wdjmrwhpzjkoafioangf.supabase.co}/storage/v1/object/pin-photos/${fileName}`, {
              method: 'POST',
              headers: {
                'apikey': sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp,
                'Authorization': `Bearer ${sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp}`,
                'Content-Type': photoFile.type
              },
              body: photoFile
            });

            if (!uploadRes.ok) {
              let detail = '';
              try {
                const errJson = await uploadRes.json();
                detail = errJson.message || errJson.error || JSON.stringify(errJson);
              } catch (e) {
                detail = await uploadRes.text().catch(() => '');
              }
              throw new Error(`照片上傳失敗 (狀態碼: ${uploadRes.status})：${detail}`);
            }

            photoPublicUrl = `${https://wdjmrwhpzjkoafioangf.supabase.co}/storage/v1/object/public/pin-photos/${fileName}`;
          }

          // B2. 寫入 Supabase 表格
          btn.innerText = "儲存座標資料中...";
          const insertRes = await fetch(`${https://wdjmrwhpzjkoafioangf.supabase.co}/rest/v1/pins`, {
            method: 'POST',
            headers: {
              'apikey': sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp,
              'Authorization': `Bearer ${sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp}`,
              'Content-Type': 'application/json',
              'Prefer': 'return=representation'
            },
            body: JSON.stringify({ address: address, lat: lat, lng: lon, photo_url: photoPublicUrl })
          });

          const insertedData = await insertRes.json();
          if (insertRes.ok && insertedData.length > 0) {
            const newPin = insertedData[0];
            renderMarker({ id: newPin.id, address: newPin.address, lat: newPin.lat, lng: newPin.lng, photo: newPin.photo_url });
            map.flyTo([lat, lon], 12);
          } else {
            const detail = insertedData.message || insertedData.error || JSON.stringify(insertedData);
            throw new Error(`資料庫寫入失敗 (狀態碼: ${insertRes.status})：${detail}`);
          }

        } else {
          // 本機保護模式
          if (photoFile) photoPublicUrl = await convertBase64(photoFile);
          const newPin = { id: Date.now(), address, lat, lng: lon, photo: photoPublicUrl };
          let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
          pins.push(newPin);
          localStorage.setItem('japan_pins', JSON.stringify(pins));
          renderMarker(newPin);
          map.flyTo([lat, lon], 12);
        }

        document.getElementById('addressInput').value = '';
        document.getElementById('photoInput').value = '';

      } catch (err) {
        console.error(err);
        alert(`錯誤: ${err.message || '連線失敗'}`);
      } finally {
        btn.innerText = "搜尋並上傳至雲端";
        btn.disabled = false;
      }
    });

    // 渲染 Pin
    function renderMarker(pin) {
      const marker = L.marker([pin.lat, pin.lng]).addTo(map);
      const popupDiv = document.createElement('div');
      popupDiv.className = 'popup-card';
      
      let photoHTML = pin.photo 
        ? `<img src="${pin.photo}" alt="${pin.address}">` 
        : `<p style="color:#888; font-size:0.8rem;">（未上傳照片）</p>`;

      popupDiv.innerHTML = `
        <h4>${pin.address}</h4>
        ${photoHTML}
        <br>
        <button class="delete-btn">刪除此別針</button>
      `;

      popupDiv.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm("確定要刪除嗎？")) {
          if (isCloudConfigured) {
            await fetch(`${https://wdjmrwhpzjkoafioangf.supabase.co}/rest/v1/pins?id=eq.${pin.id}`, {
              method: 'DELETE',
              headers: { 'apikey': sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp, 'Authorization': `Bearer ${sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp}` }
            });
          } else {
            let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
            pins = pins.filter(p => p.id !== pin.id);
            localStorage.setItem('japan_pins', JSON.stringify(pins));
          }
          map.removeLayer(marker);
        }
      });

      marker.bindPopup(popupDiv);
    }

    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
