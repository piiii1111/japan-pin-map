<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本景點別針收藏地圖</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 0; display: flex; height: 100vh; overflow: hidden; }
    #sidebar {
      width: 320px; padding: 20px; background-color: #f8f9fa;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1); z-index: 1000;
      display: flex; flex-direction: column; gap: 15px; overflow-y: auto;
    }
    h2 { margin-top: 0; color: #2c3e50; font-size: 1.25rem; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-size: 0.9rem; font-weight: bold; color: #495057; }
    input[type="text"], input[type="file"] { padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; }
    button {
      padding: 10px; background-color: #d9534f; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-weight: bold;
    }
    button:hover { background-color: #c9302c; }
    #map { flex: 1; height: 100%; }
    .popup-card { text-align: center; max-width: 220px; }
    .popup-card h4 { margin: 5px 0 8px 0; color: #333; }
    .popup-card img { width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .delete-btn { margin-top: 8px; background-color: #6c757d; padding: 4px 8px; font-size: 0.75rem; }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📍 新增線上別針紀錄</h2>
    
    <div class="form-group">
      <label for="addressInput">景點名稱或地址：</label>
      <input type="text" id="addressInput" placeholder="例如：金閣寺 或 京都府京都市..." />
    </div>

    <div class="form-group">
      <label for="photoInput">上傳別針照片：</label>
      <input type="file" id="photoInput" accept="image/*" />
    </div>

    <button id="addPinBtn">搜尋並新增至雲端</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ⚠️ 請填入你的 Supabase 專案資訊
    const SUPABASE_URL = 'https://wdjmrwhpzjkoafioangf.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_W8XGrhhPrJPhTIu6WgOLrg_gqkuseGp';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 1. 初始化地圖
    const map = L.map('map').setView([36.2048, 138.2529], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 2. 頁面載入時從雲端讀取所有 Pin
    loadPinsFromCloud();

    async function loadPinsFromCloud() {
      const { data, error } = await supabase.from('pins').select('*');
      if (error) {
        console.error('載入失敗:', error);
        return;
      }
      data.forEach(pin => renderMarker(pin));
    }

    // 3. 點擊新增
    document.getElementById('addPinBtn').addEventListener('click', async () => {
      const address = document.getElementById('addressInput').value.trim();
      const photoFile = document.getElementById('photoInput').files[0];

      if (!address) {
        alert("請輸入景點名稱或地址！");
        return;
      }

      const btn = document.getElementById('addPinBtn');
      btn.innerText = "處理中...";
      btn.disabled = true;

      try {
        // A. 上傳照片到 Supabase Storage
        let photoUrl = "";
        if (photoFile) {
          const fileName = `${Date.now()}_${photoFile.name}`;
          const { data: uploadData, error: uploadError } = await supabase
            .storage
            .from('pin-photos')
            .upload(fileName, photoFile);

          if (uploadError) throw uploadError;

          // 取得照片公開 URL
          const { data: urlData } = supabase
            .storage
            .from('pin-photos')
            .getPublicUrl(fileName);
          
          photoUrl = urlData.publicUrl;
        }

        // B. 地址轉經緯度 (Geocoding)
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await response.json();

        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);

          // C. 寫入 Supabase 資料庫
          const { data: insertData, error: insertError } = await supabase
            .from('pins')
            .insert([{ address, lat, lng: lon, photo_url: photoUrl }])
            .select();

          if (insertError) throw insertError;

          // 繪製標記並移至定位點
          renderMarker(insertData[0]);
          map.flyTo([lat, lon], 12);

          // 清空欄位
          document.getElementById('addressInput').value = '';
          document.getElementById('photoInput').value = '';
        } else {
          alert("找不到該地址！");
        }
      } catch (err) {
        console.error("失敗:", err);
        alert("新增失敗，請再試一次。");
      } finally {
        btn.innerText = "搜尋並新增至雲端";
        btn.disabled = false;
      }
    });

    // 渲染標記
    function renderMarker(pin) {
      const marker = L.marker([pin.lat, pin.lng]).addTo(map);

      const popupDiv = document.createElement('div');
      popupDiv.className = 'popup-card';
      
      let photoHTML = pin.photo_url 
        ? `<img src="${pin.photo_url}" alt="${pin.address}">` 
        : `<p style="color:#888; font-size:0.8rem;">（無照片）</p>`;

      popupDiv.innerHTML = `
        <h4>${pin.address}</h4>
        ${photoHTML}
        <br>
        <button class="delete-btn">刪除此別針</button>
      `;

      // 綁定雲端刪除功能
      popupDiv.querySelector('.delete-btn').addEventListener('click', async () => {
        if (confirm("確定要刪除這個別針嗎？")) {
          const { error } = await supabase.from('pins').delete().eq('id', pin.id);
          if (!error) {
            map.removeLayer(marker);
          } else {
            alert("刪除失敗");
          }
        }
      });

      marker.bindPopup(popupDiv);
    }
  </script>
</body>
</html>
