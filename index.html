<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本景點別針收藏地圖</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    /* 1. 確保滿版高度，不會讓地圖塌陷成 0px */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      overflow: hidden;
    }

    /* 左側側邊欄 */
    #sidebar {
      width: 320px;
      min-width: 320px;
      padding: 20px;
      background-color: #f8f9fa;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 15px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #495057;
    }

    input[type="text"], input[type="file"] {
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      padding: 10px;
      background-color: #d9534f;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
    }

    button:hover {
      background-color: #c9302c;
    }

    /* 右側地圖區域 */
    #map {
      flex: 1;
      height: 100%;
      width: 100%;
      background-color: #aad3df; /* 載入前先給海洋藍色底色 */
    }

    .popup-card {
      text-align: center;
      max-width: 200px;
    }

    .popup-card h4 {
      margin: 5px 0 8px 0;
      color: #333;
    }

    .popup-card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .delete-btn {
      margin-top: 8px;
      background-color: #6c757d;
      padding: 4px 8px;
      font-size: 0.75rem;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📍 日本別針收藏地圖</h2>
    
    <div class="form-group">
      <label for="addressInput">景點名稱或地址：</label>
      <input type="text" id="addressInput" placeholder="例如：金閣寺 或 京都府..." />
    </div>

    <div class="form-group">
      <label for="photoInput">上傳別針照片：</label>
      <input type="file" id="photoInput" accept="image/*" />
    </div>

    <button id="addPinBtn">搜尋並新增至地圖</button>

    <p style="font-size: 0.8rem; color: #6c757d; margin-top: 10px;">
      💡 本機保存模式：所有新增的別針與照片均會自動儲存於此瀏覽器中。
    </p>
  </div>

  <!-- 地圖容器 -->
  <div id="map"></div>

  <!-- 僅引入 Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // 1. 初始化 Leaflet 地圖 (中心放在日本)
    const map = L.map('map', {
      center: [36.2048, 138.2529],
      zoom: 6
    });

    // 2. 載入 OpenStreetMap 地圖碎片
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    }).addTo(map);

    // 強制更新地圖渲染尺寸（防止彈性盒模型容器未完全計算）
    setTimeout(() => { map.invalidateSize(); }, 200);

    // 3. 讀取並渲染已儲存的別針
    let pins = JSON.parse(localStorage.getItem('japan_pins')) || [];
    pins.forEach(pin => renderMarker(pin));

    // 4. 新增 Pin 事件處理
    document.getElementById('addPinBtn').addEventListener('click', async () => {
      const address = document.getElementById('addressInput').value.trim();
      const photoFile = document.getElementById('photoInput').files[0];

      if (!address) {
        alert("請輸入景點名稱或地址！");
        return;
      }

      const btn = document.getElementById('addPinBtn');
      btn.innerText = "搜尋座標中...";
      btn.disabled = true;

      try {
        // 地址轉經緯度 (Nominatim Geocoding API)
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          alert("找不到該地址，請嘗試輸入更詳細的地名。");
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lon = parseFloat(data[0].lon);

        let photoBase64 = "";
        if (photoFile) {
          photoBase64 = await convertBase64(photoFile);
        }

        const newPin = {
          id: Date.now(),
          address: address,
          lat: lat,
          lng: lon,
          photo: photoBase64
        };

        // 寫入 LocalStorage
        pins.push(newPin);
        localStorage.setItem('japan_pins', JSON.stringify(pins));
        
        renderMarker(newPin);
        map.flyTo([lat, lon], 12);

        document.getElementById('addressInput').value = '';
        document.getElementById('photoInput').value = '';

      } catch (err) {
        console.error("錯誤細節:", err);
        alert("搜尋失敗，請檢查網路連線。");
      } finally {
        btn.innerText = "搜尋並新增至地圖";
        btn.disabled = false;
      }
    });

    // 渲染地圖標記與彈出小卡
    function renderMarker(pin) {
      const marker = L.marker([pin.lat, pin.lng]).addTo(map);

      const popupDiv = document.createElement('div');
      popupDiv.className = 'popup-card';
      
      let photoHTML = pin.photo 
        ? `<img src="${pin.photo}" alt="${pin.address}">` 
        : `<p style="color:#888; font-size:0.8rem;">（未上傳照片）</p>`;

      popupDiv.innerHTML = `
        <h4>${pin.address}</h4>
        ${photoHTML}
        <br>
        <button class="delete-btn">刪除此別針</button>
      `;

      // 刪除按鈕邏輯
      popupDiv.querySelector('.delete-btn').addEventListener('click', () => {
        map.removeLayer(marker);
        pins = pins.filter(p => p.id !== pin.id);
        localStorage.setItem('japan_pins', JSON.stringify(pins));
      });

      marker.bindPopup(popupDiv);
    }

    // 圖片轉 Base64 編碼
    function convertBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
